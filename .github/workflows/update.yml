    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright キャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: 依存インストール
        run: |
          pip install playwright tqdm python-dotenv
          python -m playwright install chromium --with-deps

      - name: スクレイピング（${{ matrix.pref }} ${{ matrix.area }}）
        run: |
          mkdir -p output
          python scraper_google_maps.py --dry-run --pref "${{ matrix.pref }}" --area "${{ matrix.area }}"
        env:
          PYTHONUNBUFFERED: "1"

      - name: アーティファクト保存
        uses: actions/upload-artifact@v4
        with:
          name: shops-${{ matrix.region }}
          path: output/shops_*.json
          retention-days: 1

  # ── マージ＆コミット（全市区町村完了後に実行）────────────────────────
  merge:
    needs: scrape
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install playwright tqdm python-dotenv

      - name: アーティファクト取得
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: outputに集約
        run: |
          mkdir -p output
          find artifacts/ -name "shops_*.json" -exec cp {} output/ \;
          echo "集約ファイル数: $(ls output/shops_*.json | wc -l)"

      - name: shops.json変換
        run: |
          python convert_to_web.py output/shops_*.json --out shops.json
          cp shops.json shops-full.json
          python -c "
          import json
          shops = json.load(open('shops.json'))
          keys = ['id','name','pref','city','lat','lng','rating','tags']
          lite = [{k: s[k] for k in keys if k in s} for s in shops]
          json.dump(lite, open('shops-lite.json','w'), ensure_ascii=False)
          print(f'完了: {len(shops)}件')
          "

      - name: コミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shops.json shops-lite.json shops-full.json
          git diff --staged --quiet || git commit -m "data: 自動更新 $(date +'%Y-%m-%d')"
          git push
